replicaCount: 1

image:
  repository: quay.io/your-org/synthetic-users
  tag: latest
  pullPolicy: IfNotPresent

service:
  port: 8000

route:
  enabled: true
  tls:
    termination: edge

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 1Gi
    cpu: "1"

healthCheck:
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 30

env:
  SU_ROLE: orchestrator
  MODEL: claude-sonnet-4-6

agent:
  image:
    repository: quay.io/your-org/synthetic-users
    tag: latest
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 2Gi
      cpu: "2"
  timeout: 1800

postgresql:
  enabled: true
  auth:
    database: synthetic_users
    username: synthetic
    password: synthetic
  primary:
    persistence:
      size: 1Gi

secrets:
  anthropicApiKey: ""
  vertexProjectId: ""
  vertexRegion: ""
  modelsCorpApiKey: ""
  modelsCorpUrl: ""
