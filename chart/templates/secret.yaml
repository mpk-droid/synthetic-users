apiVersion: v1
kind: Secret
metadata:
  name: {{ include "synthetic-users.fullname" . }}
  labels:
    {{- include "synthetic-users.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ include "synthetic-users.fullname" . }}-postgresql:5432/{{ .Values.postgresql.auth.database }}
  {{- if .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.vertexProjectId }}
  ANTHROPIC_VERTEX_PROJECT_ID: {{ .Values.secrets.vertexProjectId | quote }}
  {{- end }}
  {{- if .Values.secrets.vertexRegion }}
  CLOUD_ML_REGION: {{ .Values.secrets.vertexRegion | quote }}
  {{- end }}
