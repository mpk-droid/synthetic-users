{{- if .Values.route.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "synthetic-users.fullname" . }}
  labels:
    {{- include "synthetic-users.labels" . | nindent 4 }}
spec:
  to:
    kind: Service
    name: {{ include "synthetic-users.fullname" . }}
  port:
    targetPort: {{ .Values.service.port }}
  tls:
    termination: {{ .Values.route.tls.termination }}
{{- end }}
