services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: synthetic_users
      POSTGRES_USER: synthetic
      POSTGRES_PASSWORD: synthetic
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synthetic -d synthetic_users"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      SU_ROLE: orchestrator
      DATABASE_URL: postgresql+asyncpg://synthetic:synthetic@db:5432/synthetic_users
      ANTHROPIC_VERTEX_PROJECT_ID: ${ANTHROPIC_VERTEX_PROJECT_ID:-}
      CLOUD_ML_REGION: us-east5
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_NIM_BASE_URL: ${NVIDIA_NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_NIM_MODEL: ${NVIDIA_NIM_MODEL:-nvidia/nemotron-3-ultra-550b-a55b}
      NVIDIA_NIM_FALLBACK_MODEL: ${NVIDIA_NIM_FALLBACK_MODEL:-nvidia/nemotron-3-super-120b-a12b}
      GOOGLE_APPLICATION_CREDENTIALS: /gcp/application_default_credentials.json
      SU_AGENT_IMAGE: synthetic-users-app:latest
      SU_DOCKER_NETWORK: synthetic-users_default
      SU_ORCHESTRATOR_HOST: app
      SU_GCP_CREDENTIALS_HOST_PATH: ${HOME}/.config/gcloud/application_default_credentials.json
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.config/gcloud/application_default_credentials.json:/gcp/application_default_credentials.json:ro

volumes:
  pgdata:
